{% include 'dashboard/cabecalho.html' %}

<h1 class="mb-4">Lista de Matrículas</h1>

<div class="mt-3 mb-4">
    <a href="/matricula/form" class="btn btn-primary mb-3">Novo</a>
</div>


<div class="row">
    
    <table class="table table-bordered table-striped">
        <tbody class="table-dark">
            
            <tr>
                <th>ID</th>
                <th>Aluno</th>
                <th>Curso</th>
                <th>Semestre</th>
                <th>Ações</th>
            </tr>

        </tbody>


            {% for matricula in lista %}
            <tr>
                <td>{{ matricula[0] }}</td>
                <td>{{ matricula[1] }}</td>
                <td>{{ matricula[2] }}</td>
                <td>{{ matricula[3] }}</td>
                <td>
                        <a href="/matricula/editar/{{ matricula[0] }}" class="btn btn-primary btn-sm">Editar</a>
                        <a href="/matricula/remover/{{ matricula[0] }}" class="btn btn-danger btn-sm"
                        onclick="return confirm('Tem certeza que deseja remover este registro?');">Remover</a>
                </td>
            </tr>
            {% endfor %}


    </table>

</div>

{% include 'dashboard/rodape.html' %}
