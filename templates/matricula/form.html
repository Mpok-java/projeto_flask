{% include 'dashboard/cabecalho.html' %}

<!-- Formulário de Matrícula -->
<h1 class="mb-4">Cadastrar Matrícula</h1>
<div class="row">
    <div class="col-12">
      <form action="/matricula/salvar/" method="POST">
  
        <!-- Aluno -->
        <div class="mb-3">
          <label for="aluno_id" class="form-label">Aluno</label>
          <select name="aluno_id" id="aluno_id" class="form-control" required>

            {% for aluno in lista_aluno %}
              <option value=" {{ aluno.0 }} " {{ "selected" if matricula.1 == aluno.0 else "" }}>{{ aluno.1 }}</option>
            {% endfor %}

          </select>
        </div>
  
        <!-- Curso --> 
        <div class="mb-3">
          <label for="curso_id" class="form-label">Curso</label>
          <select name="curso_id" id="curso_id" class="form-control" required>

            {% for curso in lista_curso %}
              <option value=" {{ curso.0 }} " {{ "selected" if matricula.2 == curso.0 else "" }}>{{ curso.1 }}</option>
            {% endfor %}
            
          </select>
        </div>

        <!-- Semestre --> 
        <div class="mb-3">
          <label for="semestre" class="form-label">Semestre</label>
          <select name="semestre" id="semestre" class="form-control" required>

            {% for turma in lista_turma %}
              <option value=" {{ turma.0 }} " {{ "selected" if matricula.3 == turma.0 else "" }}>{{ turma.1 }}</option>
            {% endfor %}

          </select>
        </div>
  
        <!-- Botões -->
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Salvar</button>
          <a href="/matricula" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
    </div>
  </div>
