
{% include 'dashboard/cabecalho.html' %}

<!-- Formulário de Turma -->
<h1 class="mb-4">Cadastrar Turma</h1>

<div class="row">
    <div class="col-12">
      <form action="/turma/salvar/{{ turma[0] }}" method="POST">
  
        <!-- Semestre -->
      <div class="mb-3">
        <label for="semestre" class="form-label">Semestre</label>
        <input type="text" class="form-control" id="semestre" name="semestre" value="{{ turma[1] }}" required>
      </div>



  
         <!-- Curso -->
      <div class="mb-4">
        <label for="curso_id" class="form-label">Curso </label>
        <select name="curso_id" id="curso_id" class="form-select" required>

            <option value=" 1 ">Informática</option>

            <option value=" 2 ">Administração</option>

            <option value=" 3 ">Enfermagem</option>

            <option value=" 4 ">Eletrotécina</option>

        </select>
      </div>


      <!-- Professor -->
      <div class="mb-3">
        <label for="professor_id" class="form-label">Professor</label>
        <select name="professor_id" id="professor_id" class="form-select" required>
          <option value="" disabled selected>Selecione um professor</option>
          {% if turma %}
            <option value="{{ turma[3] }}" selected>{{ turma[3] }}</option>
          {% endif %}
          {% for professor in lista_professores %}
            <option value="{{ professor[0] }}" {% if turma and professor[0] == turma[3] %}selected{% endif %}>André Ferreira</option>

            <option value="{{ professor[0] }}" {% if turma and professor[0] == turma[3] %}selected{% endif %}>Luciana Teixeira</option>

            <option value="{{ professor[0] }}" {% if turma and professor[0] == turma[3] %}selected{% endif %}>Pedro Oliveira</option>

            <option value="{{ professor[0] }}" {% if turma and professor[0] == turma[3] %}selected{% endif %}>Fernanda Lima</option>
            
            <option value="{{ professor[0] }}" {% if turma and professor[0] == turma[3] %}selected{% endif %}>Jefferson de Sousa Silva</option> 

          {% endfor %}
        </select>
      </div>


      <!-- Botões -->
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="/turma" class="btn btn-secondary">Cancelar</a>
      </div>

    </form>
  </div>
</div>

  
  {% include 'dashboard/rodape.html' %}
