
{% include 'dashboard/cabecalho.html' %}

<!-- Formulário de Turma -->
<h1 class="mb-4">Cadastrar Turma</h1>

<div class="row">
    <div class="col-12">
      <form action="/turma/salvar/{{ turma[0] }}" method="POST">
  
        <!-- Semestre -->
      <div class="mb-3">
        <label for="semestre" class="form-label">Semestre</label>
        <input type="text" class="form-control" id="semestre" name="semestre" value="{{ turma[1] }}" required>
      </div>



  
         <!-- Curso -->
      <div class="mb-4">
        <label for="curso_id" class="form-label">Curso </label>
        <select name="curso_id" id="curso_id" class="form-select" required>
          
          {% for curso in lista_curso %}
            <option value=" {{ curso.0 }} " {{ "selected" if turma.2 == curso.0 else "" }}>{{ curso.1 }}</option>
          {% endfor %}

        </select>
      </div>


      <!-- Professor -->
      <div class="mb-3">
        <label for="professor_id" class="form-label">Professor</label>
        <select name="professor_id" id="professor_id" class="form-select" required>
  
          {% for professor in lista_professor %}
            <option value=" {{ professor.0 }} " {{ "selected" if turma.3 == professor.0 else "" }}>{{ professor.1 }}</option>
          {% endfor %}

        </select>
      </div>


      <!-- Botões -->
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="/turma" class="btn btn-secondary">Cancelar</a>
      </div>

    </form>
  </div>
</div>

  
  {% include 'dashboard/rodape.html' %}
