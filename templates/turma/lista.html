{% include 'dashboard/cabecalho.html' %}

<h1 class="mb-4">Listagem de Turmas</h1>

<div class="mt-3 mb-4">
    <a href="/turma/form" class="btn btn-primary mb-3">Novo</a>
</div>

<div class="row">
    
    <table class="table table-bordered table-striped">
        <tbody class="table-dark">
            <tr>
                <th>ID</th>
                <th>Semestre</th>
                <th>Curso</th>
                <th>Professor</th>
                <th>Disciplina</th>
                <td>Ações</td>
            </tr>
        </tbody>




            {% for turma in lista %}

                    <tr>
                        <td>{{ turma[0] }}</td>
                        <td>{{ turma[1] }}</td>
                        <td>{{ turma[2] }}</td>
                        <td>{{ turma[3] }}</td>
                        <td>{{ turma[4] }}</td>
                        <td>
                            <a href="/turma/editar/{{ turma[0] }}" class="btn btn-primary btn-sm">Editar</a>
                            <a href="/turma/remover/{{ turma[0] }}" class="btn btn-danger btn-sm"
                            onclick="return confirm('Tem certeza que deseja remover este registro?');">Remover</a>
                        </td>
                    </tr>


            {% endfor %}
            
        
    </table>
</div>


{% include 'dashboard/rodape.html' %}
